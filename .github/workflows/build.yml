name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential

      - name: Force default python to 3.11
        run: |
          sudo update-alternatives --install /usr/bin/python python /opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11 1
          sudo update-alternatives --set python /opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11
          sudo ln -sf /opt/hostedtoolcache/Python/3.11.15/x64/bin/python3.11 /usr/bin/python3
          python --version
          python3 --version

      - name: Install buildozer with pip
        run: |
          python3.11 -m pip install --upgrade pip setuptools wheel Cython==0.29.33
          python3.11 -m pip install buildozer

      - name: Build APK
        run: |
          yes | python3.11 -m buildozer -v android debug 2>&1 | tee build_log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-apk
          path: bin/*.apk
