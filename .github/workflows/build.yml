name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev cmake libffi-dev libssl-dev build-essential

      - name: Install buildozer with Python 3.11
        run: |
          python3.11 -m pip install --upgrade pip
          python3.11 -m pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          yes | python3.11 -m buildozer android debug 2>&1 | tee build_log.txt

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_log.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chatapp-apk
          path: bin/*.apk
